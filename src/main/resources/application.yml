server:
  port: 8084

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: loi114
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:4321/realms/ecommerce-realm # Đồng bộ với Keycloak realm

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: java.util.*,com.tlcn.*
    listener:
      ack-mode: manual_immediate
    topics:
      stock-reservation-request: stock-reservation-request
      stock-rollback-request: stock-rollback-request
      stock-reservation-response: stock-reservation-response
      suborder-shipping-requested: suborder-shipping-requested
      suborder-payout-requested: suborder-payout-requested
      shipment-created: shipment-created
      shipment-status-changed: shipment-status-changed
      discount-commands: discount.commands
      discount-events: discount.events
      discount-replies: discount.replies
      payment-success: payment-success
      payment-failed: payment-failed
      payment-refund-request: payment-refund-request
      order-completed: order-completed-topic
      return-request-changed: return-request-changed

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      enabled: true
    instance:
      prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    ip-address: ${spring.cloud.client.ip-address}

return:
  window-days: 7
  auto-approve-hours: 48

http:
  client:
    connect-timeout: 2s
    read-timeout: 5s

discount:
  reply:
    timeout-seconds: 5
    key-ttl-seconds: 30

stock:
  reservation:
    timeout-seconds: 10
    key-ttl-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s
        ignoreExceptions:
          - com.tlcn.order_service.exception.BusinessException
          - com.tlcn.order_service.exception.ResourceNotFoundException
      productService:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        ignoreExceptions:
          - com.tlcn.order_service.exception.BusinessException
          - com.tlcn.order_service.exception.ResourceNotFoundException
  retry:
    instances:
      paymentService:
        maxAttempts: 2
        waitDuration: 200ms
        enableExponentialBackoff: false
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
      productService:
        maxAttempts: 2
        waitDuration: 150ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - com.tlcn.order_service.exception.ResourceNotFoundException
          - com.tlcn.order_service.exception.BusinessException

management:
  endpoints:
    web:
      exposure:
        include: health, info, circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud: DEBUG
    com.netflix.discovery: DEBUG
    com.tlcn: DEBUG
    org.keycloak: DEBUG
